experiment:
  backend: pytorch
  data_config:
    strategy: fixed
    train_path: ../data/{0}/dropped/train_final_indexed.tsv     #
    validation_path: ../data/{0}/dropped/val_final_indexed.tsv  #
    test_path: ../data/{0}/dropped/test_final_indexed.tsv       #
    side_information:
      - dataloader: VisualAttribute
        visual_features: ../data/{0}/dropped/visual_embeddings_final_indexed     #
      - dataloader: TextualAttribute
        textual_features: ../data/{0}/dropped/textual_embeddings_final_indexed   #
  
  
  dataset: Office_Products
  top_k: 20
  evaluation:
    cutoffs: [ 20 ]
    simple_metrics: [ Recall, nDCG, Precision ]
  gpu: 0
  external_models_path: ../external/models/__init__.py
  models:
    external.VBPR:
      meta:
        hyper_opt_alg: grid
        verbose: True
        save_weights: False
        save_recs: False
        validation_rate: 1
        validation_metric: Recall@20
        restore: False
      lr: [0.005]   
      factors: 64
      epochs: 200
      l_w: [1e-5]  
      modalities: ('visual', 'textual') 
      loaders: ('VisualAttribute','TextualAttribute')
      batch_size: 1024  
      comb_mod: concat
      seed: 123
      early_stopping:
        patience: 5
        mode: auto
        monitor: Recall@20
        verbose: True