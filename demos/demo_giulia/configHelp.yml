dataset_path: ./local/data/demo_giulia
gpu list: 0

visual:
     items:
          input_path: images
          output_path: visual_embeddings
          model: [
              { model_name: ResNet50,  output_layers: avgpool, reshape: [224, 224], preprocessing: zscore, backend: torch, batch_size: 1},
          ]

textual:
     items:
          input_path: meta.tsv
          output_path: textual_embeddings
          item_column: asin
          text_column: description
          model: [
            { model_name: sentence-transformers/all-mpnet-base-v2,  output_layers: 1, clear_text: False, backend: sentence_transformers, batch_size: 32},
          ]
 
visual_textual:
     items:
          input_path: { visual: images, textual: meta.tsv }
          output_path: { visual: visual_embeddings_vt, textual: textual_embeddings_vt}
          item_column: asin
          text_column: description
          model: [
                  { model_name: openai/clip-vit-base-patch16, output_layers: 1, backend: transformers, batch_size: 64}
          ]   

#imputation: 
     unimodal:
          visual: 
               input_path: #embedding path
               output_path: #imputed path
               methods: [
                    { method_name: zeros, missing_file: missing_visual.tsv},
                    { method_name: random, missing_file: missing_visual.tsv, seed: 42},
                    { method_name: mean, missing_file: missing_visual.tsv},
                    { method_name: neighmean, missing_file: missing_visual.tsv, train_path: ./local/data/demo_giulia/train.tsv, top_k: 3},
                    { method_name: featprop, missing_file: missing_visual.tsv, train_path: ./local/data/demo_giulia/train.tsv,  top_k: 1, layers: 2},
                    { method_name: perspagerank, missing_file: missing_visual.tsv, train_path: ./local/data/demo_giulia/train.tsv, top_k: 1, layers: 2, alpha: 1},
                    { method_name: heat, missing_file: missing_visual.tsv, train_path: ./local/data/demo_giulia/train.tsv, top_k: 1, layers: 2, time: 1},
               ]
          textual: 
               input_path: #embedding path
               output_path: #imputed path
               methods: [
                    { method_name: zeros, missing_file: missing_textual.tsv},
                    { method_name: random, missing_file: missing_textual.tsv, seed: 42},
                    { method_name: mean, missing_file: missing_textual.tsv},
                    { method_name: neighmean, missing_file: missing_textual.tsv, train_path: ./local/data/demo_giulia/train.tsv, top_k: 3},
                    { method_name: featprop, missing_file: missing_textual.tsv, train_path: ./local/data/demo_giulia/train.tsv,  top_k: 1, layers: 2},
                    { method_name: perspagerank, missing_file: missing_textual.tsv, train_path: ./local/data/demo_giulia/train.tsv, top_k: 1, layers: 2, alpha: 1},
                    { method_name: heat, missing_file: missing_textual.tsv, train_path: ./local/data/demo_giulia/train.tsv, top_k: 1, layers: 2, time: 1},
               ]
     crossmodal: 
          visual_textual: 
               input_path: #embedding path
               output_path: #imputed path
               methods: [
                           { method_name: autoenc, missing_visual_file: missing_visual.tsv , missing_textual_file: missing_textual.tsv}, #seed
                           { method_name: graphautoenc,  missing_visual_file: missing_visual.tsv , missing_textual_file: missing_textual.tsv, train_path: ./local/data/demo_giulia/train.tsv, top_k: 1},   
                           { method_name: vigan, missing_visual_file: missing_visual.tsv , missing_textual_file: missing_textual.tsv},
               ]


#sotto cancella tutto

imputation:  
  unimodal:  
    visual:                
      input_path: 'visual_embeddings'                        
      output_path: 'imputed/unimodal/visual_embeddings'        
      methods:  [
                 { method_name: zeros, missing_file: missing_visual.tsv},              
                 { method_name: zeros, missing_percentage: [0.2, 0.3], items_file: items.tsv, seed: 42},
      ]

    
  crossmodal: 
   visual_textual:
    input_path: { visual: 'visual_embeddings', textual: 'textual_embeddings'}
    output_path: { visual: 'imputed/crossmodal/visual_embeddings', textual: 'imputed/crossmodal/textual_embeddings'}           
    methods:  [
               { method_name: autoenc, missing_visual_file: missing_visual.tsv, missing_textual_file: missing_textual.tsv, seed: 42},
               { method_name: autoenc, missing_percentage_visual: [0.3, 0.5], missing_percentage_textual: [0.3, 0.5], items_file: items.tsv, seed: 42},
    ]
 
