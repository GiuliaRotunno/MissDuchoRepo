dataset_path: ./local/data/demo_elliot/beauty90
gpu list: 0

imputation:  
  unimodal:  
    visual:                
      input_path:  'extracted/visual_embeddings/torch/ResNet50/avgpool'  
      output_path: 'imputed/visual_embeddings/mp90'                  
      methods: [         
                { method_name: zeros, missing_file: missing_visual.tsv},
                { method_name: random, missing_file: missing_visual.tsv, seed: 42},
                { method_name: mean, missing_file: missing_visual.tsv},
                { method_name: neighmean, missing_file: missing_visual.tsv, train_path: reviews.tsv, top_k: 100}, 
                { method_name: featprop, missing_file: missing_visual.tsv, train_path: reviews.tsv,  top_k: 100, layers: 10},
                { method_name: perspagerank, missing_file: missing_visual.tsv, train_path: reviews.tsv, top_k: 100, layers: 10, alpha: 0.1},
                { method_name: heat, missing_file: missing_visual.tsv, train_path: reviews.tsv, top_k: 100, layers: 10, time: 5.0}
      ]
    
    textual:
      input_path:  'extracted/textual_embeddings/sentence_transformers/sentence-transformers/all-mpnet-base-v2/1'  
      output_path: 'imputed/textual_embeddings/mp90'                                    
      methods: [
                { method_name: zeros, missing_file: missing_textual.tsv},
                { method_name: random, missing_file: missing_textual.tsv, seed: 42},
                { method_name: mean, missing_file: missing_textual.tsv}, 
                { method_name: neighmean, missing_file: missing_textual.tsv, train_path: reviews.tsv, top_k: 100},
                { method_name: featprop, missing_file: missing_textual.tsv, train_path: reviews.tsv,  top_k: 100, layers: 10},
                { method_name: perspagerank, missing_file: missing_textual.tsv, train_path: reviews.tsv, top_k: 100, layers: 10, alpha: 0.1},
                { method_name: heat, missing_file: missing_textual.tsv, train_path: reviews.tsv, top_k: 100, layers: 10, time: 5.0}
      ]

  crossmodal: 
    visual_textual:
      input_path: { visual:  'extracted/visual_embeddings/torch/ResNet50/avgpool', textual: 'extracted/textual_embeddings/sentence_transformers/sentence-transformers/all-mpnet-base-v2/1'}   
      output_path: { visual: 'imputed/visual_embeddings/mp90', textual: 'imputed/textual_embeddings/mp90'}                                                                       
      methods:  [
                 { method_name: autoenc, missing_visual_file: missing_visual.tsv, missing_textual_file: missing_textual.tsv, seed: 42},
                 { method_name: graphautoenc, missing_visual_file: missing_visual.tsv , missing_textual_file: missing_textual.tsv, train_path: reviews.tsv, top_k: 100, seed: 42},
                 { method_name: varautoenc, missing_visual_file: missing_visual.tsv, missing_textual_file: missing_textual.tsv, seed: 42},
                 { method_name: vargraphautoenc, missing_visual_file: missing_visual.tsv , missing_textual_file: missing_textual.tsv, train_path: reviews.tsv, top_k: 100, seed: 42},
                 { method_name: vigan, missing_visual_file: missing_visual.tsv , missing_textual_file: missing_textual.tsv, seed: 42},
                 { method_name: smil, missing_visual_file: missing_visual.tsv, missing_textual_file: missing_textual.tsv, seed: 42, num_epochs: 200, learning_rate: 0.0001, batch_size: 32, alpha: 1.0, beta: 1.0},
                 { method_name: mmin, missing_visual_file: missing_visual.tsv, missing_textual_file: missing_textual.tsv, seed: 42, num_epochs: 100, learning_rate: 0.0002, batch_size: 32, n_blocks: 3, dropout: 0.3, mse_weight: 1.0, cycle_weight: 1.0},  
                 { method_name: dicmor, missing_visual_file: missing_visual.tsv, missing_textual_file: missing_textual.tsv, seed: 42, num_epochs: 100, learning_rate: 0.00005, batch_size: 32, log_p_weight: 0.001, n_flow: 16, n_block: 1, rcan_blocks: 10}
      ]